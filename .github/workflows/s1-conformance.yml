name: S1 Read-only Conformance

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s1-conformance:
    name: S1 schemas, replay and no-actuation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install -r requirements.txt
      - name: Run S1 conformance
        run: npm run check
      - name: Upload Chromium extension package
        uses: actions/upload-artifact@v4
        with:
          name: arb-agent-chromium-${{ github.sha }}
          path: dist/arb-agent-chromium.zip
          if-no-files-found: error
          retention-days: 30
